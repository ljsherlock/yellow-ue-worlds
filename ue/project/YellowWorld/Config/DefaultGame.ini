[/Script/UnrealEd.ProjectPackagingSettings]
; Maps to cook are driven per-build by RunUAT's -map= flag (see
; build/build-in-container.sh, MAP env). We intentionally do NOT hard-code
; +MapsToCook here: when cooking an imported map (SKIP_MAKE_MAP=1) the spike
; level isn't generated, and a stale +MapsToCook=Spike would fail the cook.
;
; Creatures (the MalberS elephant) are loaded by soft path at RUNTIME via the
; CreatureDirector, so the map holds no hard reference to them and the cooker
; would otherwise skip them. Force the whole pack to cook so LoadSynchronous
; finds the SkeletalMeshes + AnimSequences in the packaged build.
+DirectoriesToAlwaysCook=(Path="/Game/Elephant")
