[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/Maps/Spike.Spike
EditorStartupMap=/Game/Maps/Spike.Spike
ServerDefaultMap=/Game/Maps/Spike.Spike
; Every map without its own World Settings override uses our fly camera (AFlyPawn
; via AFlyGameMode): fast WASD/QE + mouse look, hold Shift for 10x. The stock
; DefaultPawn (12 m/s) is unusable on an 8 km map. Imported packs ship no
; GameMode, so this global default applies to the Savannah map too.
GlobalDefaultGameMode=/Script/YellowWorld.FlyGameMode

; Remote Control web server binds to localhost by default. 0.0.0.0 lets our
; rc-bridge reach it from outside the container/VM (HTTP 30010 / WS 30020).
; The server itself is still gated behind the -RCWebControlEnable launch flag.
[HTTPServer.Listeners]
DefaultBindAddress=0.0.0.0

; Applied at early CVar init (before the editor's WebBrowser/CEF starts).
; Fab's panel is an embedded Chromium; its GPU process dies (exit code 21) in the
; headless container, so disable CEF GPU accel — UE then passes Chromium
; --disable-gpu/--disable-gpu-compositing (see CEFBrowserApp.cpp). No effect on the
; packaged Pixel Streaming build, which never opens a web view.
[ConsoleVariables]
r.CEFGPUAcceleration=0

; Headless server rendering: keep it deterministic and cheap for the spike.
[/Script/Engine.RendererSettings]
r.DefaultFeature.AutoExposure=False
r.AllowOcclusionQueries=True
; Imported packs (e.g. the Savannah landscape) ship with Lumen enabled. Lumen
; needs a scene representation to trace: either hardware ray tracing (flaky on
; the containerised T4 over headless Vulkan) or *software* tracing via mesh
; distance fields. We pick software Lumen — generate mesh distance fields at
; cook time. Without this Lumen has no data, disables itself, logs the on-screen
; "no ray tracing data" warning, and surfaces get wrong reflections. Built at
; cook, so this adds a little cook time + package size (distance-field data).
r.GenerateMeshDistanceFields=True

; Water plugin requires the WaterBodyCollision profile. The editor writes this
; automatically when you enable Water via the UI, but we enabled the plugin by
; hand-editing the .uproject, so it must be added here. Without it the headless
; commandlet logs a fatal LoadError ("Add entry to DefaultEngine.ini?") and
; exits 1, aborting the cook. Verified against Epic forum + community sources.
[/Script/Engine.CollisionProfile]
+Profiles=(Name="WaterBodyCollision",CollisionEnabled=QueryOnly,bCanModify=False,ObjectTypeName="",CustomResponses=((Channel="WorldDynamic",Response=ECR_Overlap),(Channel="Pawn",Response=ECR_Overlap),(Channel="Visibility",Response=ECR_Ignore),(Channel="Camera",Response=ECR_Ignore),(Channel="PhysicsBody",Response=ECR_Overlap),(Channel="Vehicle",Response=ECR_Overlap),(Channel="Destructible",Response=ECR_Overlap)),HelpMessage="Default Water Collision Profile (Created by Water Plugin)")
